[project]
name = "feedback-eval"
version = "0.1.0"
description = "Evaluate customer feedback texts on configurable dimensions with TypeSafe's Jev model"
requires-python = ">=3.10"
dependencies = ["typesafe-sdk>=0.7.4", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
feedback-eval = "feedback_eval.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["feedback_eval"]
