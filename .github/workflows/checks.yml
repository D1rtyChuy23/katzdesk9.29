# Runs on every PR (and on main after a merge): the same checks AGENTS.project.md asks every agent to run.
# It runs, but it only blocks a merge once main's ruleset requires the "checks" status (Chuy turns that on in GitHub).
# DATABASE_URL is pinned empty: every database test runs on PGLite, and the build's migrate step skips.
# Never add a DATABASE_URL secret here: 29 tests and the migrate step would then use that database.
name: Checks

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATABASE_URL: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Grok's sandbox runs Node 22. The test script needs --experimental-strip-types and a quoted glob, which 22 has.
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint (errors fail; warnings don't)
        run: npm run lint
      - name: Build (the same build Vercel runs; migrations skip with no DATABASE_URL)
        run: npm run build
      - name: Tests (full suite)
        run: npm test
